name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  # 允许手动触发
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    
    # 服务容器
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      
      - name: 生成 Prisma Client
        working-directory: backend
        run: npm run prisma:generate
      
      - name: 运行 Oxlint
        working-directory: backend
        run: npm run lint
      
      - name: 运行类型检查
        working-directory: backend
        run: npx tsc --noEmit
      
      - name: 检查 OpenAPI 与前端类型
        working-directory: backend
        run: npm run openapi:check
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: 运行单元测试
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret
          ENCRYPTION_KEY: ci-test-encryption-key-32-bytes!
        run: npm run test:cov
      
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: 测试覆盖率报告
        working-directory: backend
        run: |
          echo "📊 测试覆盖率:"
          cat coverage/coverage-summary.json || echo "覆盖率报告生成中..."
        continue-on-error: true
