# T254 / OPS-03：HTTPS 入口（可选挂载）
# 用法：把证书放到 ./certs（fullchain.pem + privkey.pem），再叠加
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
# 该文件被 include 进 http 上下文；不要在此写 user / events。
# 未挂载时（默认 HTTP 部署）nginx 不会读取本文件，因此缺证书不影响启动。

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html/admin;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  keepalive_timeout 65s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  error_page 413 = @payload_too_large;
  location @payload_too_large {
    default_type application/json;
    return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"请求体超过 10MB 上限"}';
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream backend:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req zone=api_edge burst=60 nodelay;
    proxy_request_buffering off;
  }

  location /landing/ {
    alias /usr/share/nginx/html/landing/;
    expires 1h;
  }

  location / {
    root /usr/share/nginx/html/admin;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
}
