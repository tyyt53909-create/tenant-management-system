# OPT-25 / T198：管理后台 + 落地页反代配置
# T254 / OPS-03：上传上限、边缘限流、安全头与 413 JSON。
# 容器内以 nginx 用户监听 8080（HTTP）；HTTPS 由 nginx-admin-tls.conf 挂载证书后启用。
# 注意：本文件被 include 进 nginx.conf 的 http 上下文，
# 因此只能写 http 级指令（upstream / server / gzip…），不能写 user / pid / events。

# 静态压缩
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 隐藏版本号
server_tokens off;

# 边缘限流：按来源 IP 粗粒度限制，细粒度配额仍由后端 THROTTLE_* 负责。
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=30r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  # 默认根（精确匹配 location 等无自身 root 的块继承用）
  root /usr/share/nginx/html/admin;

  # 上传上限与后端 MAX_SIZE（10MB）一致：8MB 照片可通过，11MB 回 413 JSON。
  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  keepalive_timeout 65s;

  # 安全头（API 的 CSP 等由后端 helmet 下发；这里覆盖静态资源与错误响应）
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # 超限统一返回 JSON，避免前端拿到 nginx 默认 HTML。
  error_page 413 = @payload_too_large;
  location @payload_too_large {
    default_type application/json;
    return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"请求体超过 10MB 上限"}';
  }

  # 后端 API（保留 /api 前缀，后端 setGlobalPrefix('api')；变量式 proxy 做运行时解析，backend 重启换 IP 也不怕）
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream backend:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req zone=api_edge burst=60 nodelay;
    # 上传流式转发，避免 nginx 先落盘再转发占用磁盘。
    proxy_request_buffering off;
  }

  # 落地页静态站
  location /landing/ {
    alias /usr/share/nginx/html/landing/;
    expires 1h;
  }

  # 管理后台（Vue SPA）
  location / {
    root /usr/share/nginx/html/admin;
    try_files $uri $uri/ /index.html;
  }
  # index.html 不缓存；location 内一旦出现 add_header 就不再继承 server 级安全头，故重复声明。
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
}
