# OPT-25 / T198：管理后台 + 落地页反代配置
# 容器内以 nginx 用户监听 8080（HTTP）/ 8443（HTTPS，需挂载证书后取消 443 段注释）。
# 注意：本文件被 include 进 nginx.conf 的 http 上下文，
# 因此只能写 http 级指令（upstream / server / gzip…），不能写 user / pid / events。

# 静态压缩
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 后端引用注：compose 内 backend 容器 IP 会变，故 /api 段用变量式 proxy_pass + 内嵌 DNS
# 做运行时解析（见 location /api/），此处不再写静态 upstream。

server {
  listen 8080;
  server_name _;
  # 默认根（精确匹配 location 等无自身 root 的块继承用）
  root /usr/share/nginx/html/admin;

  # 静态安全头（API 自身的 CSP 等由后端 helmet 下发，此处只加传输层通用头）
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # 后端 API（保留 /api 前缀，后端 setGlobalPrefix('api')；变量式 proxy 做运行时解析，backend 重启换 IP 也不怕）
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream backend:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # 落地页静态站
  location /landing/ {
    alias /usr/share/nginx/html/landing/;
    expires 1h;
  }

  # 管理后台（Vue SPA）
  location / {
    root /usr/share/nginx/html/admin;
    try_files $uri $uri/ /index.html;
  }
  # index.html 不缓存，带 hash 静态资源由构建自带长缓存
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }
}

