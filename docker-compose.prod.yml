# OPT-25 / T198：生产 / 预发编排
# 用法（30 分钟部署，详见 docs/12-部署与运维.md §7）：
#   cp .env.prod.example .env.prod   # 填强密码与密钥（不入库）
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile seed run --rm seed   # 仅首次
# 回滚：改 TAG 为上一个版本号后 up -d 即可。

name: tenant-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tenant_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?生产必须设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tenant_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tenant_user} -d ${DB_NAME:-tenant_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # 注意：不映射宿主机端口，仅容器网络内可达

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  migrate:
    image: ${BACKEND_IMAGE:-tenant-backend}:${TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tenant_user}:${DB_PASSWORD:?生产必须设置 DB_PASSWORD}@postgres:5432/${DB_NAME:-tenant_system}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-tenant-backend}:${TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # T253 / OPS-02：优雅关闭与最小权限运行。
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-tenant_user}:${DB_PASSWORD:?生产必须设置 DB_PASSWORD}@postgres:5432/${DB_NAME:-tenant_system}?schema=public
      JWT_SECRET: ${JWT_SECRET:?生产必须设置 JWT_SECRET（≥32 字节随机串）}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?生产必须设置 ENCRYPTION_KEY（32 字节）}
      CORS_ORIGINS: ${CORS_ORIGINS:?生产必须设置 CORS_ORIGINS（逗号分隔、不允许 *）}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # REDIS_URL 优先；未设置时用下面的 HOST/PORT/PASSWORD/DB 组装
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_AUTH_MOCK: "false"
      OTP_DEV_BYPASS: "false"
      FEATURE_METER_SIMULATOR: "false"
      DEFAULT_BUILDING_ID: ${DEFAULT_BUILDING_ID:-building-001}
      THROTTLE_GLOBAL_LIMIT: ${THROTTLE_GLOBAL_LIMIT:-}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-}
      THROTTLE_OTP_LIMIT: ${THROTTLE_OTP_LIMIT:-}
      THROTTLE_OTP_IP_LIMIT: ${THROTTLE_OTP_IP_LIMIT:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    # 注意：不对外映射端口，只经 web 反代

  web:
    image: ${WEB_IMAGE:-tenant-web}:${TAG:-local}
    build:
      context: .
      dockerfile: frontend-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: always
    ports:
      - "${WEB_PORT:-80}:8080"
      # - "${WEB_TLS_PORT:-443}:8443"  # 挂载证书并取消 nginx 443 段注释后启用
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # 首次部署种子（生产必须显式提供四个账号变量，否则脚本拒绝执行；
  # seed 为构建期预编译 JS，与 app 共用同一镜像，无需 ts-node）
  seed:
    image: ${BACKEND_IMAGE:-tenant-backend}:${TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    command: ["node", "dist-seed/seed.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-tenant_user}:${DB_PASSWORD:?生产必须设置 DB_PASSWORD}@postgres:5432/${DB_NAME:-tenant_system}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?首次种子必须提供 ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?首次种子必须提供 ADMIN_PASSWORD}
      CLEANER_EMAIL: ${CLEANER_EMAIL:?首次种子必须提供 CLEANER_EMAIL}
      CLEANER_PASSWORD: ${CLEANER_PASSWORD:?首次种子必须提供 CLEANER_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  internal:
    driver: bridge
